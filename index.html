<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d6a4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>שיעורי הבית שלי</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6ee;--card:#fff;--tx:#1b2a22;--mu:#66756b;--pr:#2d6a4f;--pr2:#40916c;--bd:#dde6d8;--ok:#2d9a5f;--wip:#e08a00;--bad:#d64545;--chip:#e8f0e2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b261f;--tx:#eaf3ec;--mu:#9bb0a2;--pr:#52b788;--pr2:#74c69d;--bd:#2c3b31;--chip:#243229}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1b261f;--tx:#eaf3ec;--mu:#9bb0a2;--pr:#52b788;--pr2:#74c69d;--bd:#2c3b31;--chip:#243229}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:90px}
header{background:linear-gradient(135deg,#2d6a4f,#40916c);color:#fff;padding:18px 16px 22px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:24px;font-weight:800}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
.hb{float:left;display:flex;gap:6px}
.ib{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;width:40px;height:40px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px;margin-top:-14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 4px;text-align:center}
.st b{display:block;font-size:24px;font-weight:800}
.st span{font-size:12px;color:var(--mu)}
.bar{padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%}
.bar select{width:auto;flex:1;min-width:120px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:20px;padding:8px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.list{padding:0 12px;display:grid;gap:10px}
.task{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:flex-start;border-inline-start:6px solid var(--mu)}
.task.s0{border-inline-start-color:var(--mu)}.task.s1{border-inline-start-color:var(--wip)}.task.s2{border-inline-start-color:var(--ok)}
.task.s2 .nm{text-decoration:line-through;opacity:.6}
.stb{background:none;border:0;font-size:30px;line-height:1;padding:0}
.bd{flex:1;min-width:0}
.nm{font-weight:600;font-size:17px;word-break:break-word}
.tg{display:inline-block;background:var(--chip);border-radius:10px;padding:2px 10px;font-size:13px;margin-top:4px}
.ds{color:var(--mu);font-size:14px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.dt{font-size:13px;color:var(--mu);margin-top:4px}.dt.late{color:var(--bad);font-weight:600}
.ac{display:flex;flex-direction:column;gap:4px}
.ac button{background:none;border:0;font-size:20px;padding:4px}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border:0;border-radius:28px;padding:16px 22px;font:inherit;font-weight:600;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.ov.open{display:flex}
.sh{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
.row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:16px;background:var(--pr);color:#fff}
.btn.g{background:var(--chip);color:var(--tx)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:9;display:none}
</style>
</head>
<body>
<header>
  <div class="hb"><button class="ib" id="bk" aria-label="גיבוי ושחזור">💾</button></div>
  <h1>📚 שיעורי הבית שלי</h1>
  <p id="hi"></p>
</header>
<div class="stats">
  <div class="st"><b id="c0">0</b><span>⬜ לא התחלתי</span></div>
  <div class="st"><b id="c1">0</b><span>◩ בתהליך</span></div>
  <div class="st"><b id="c2">0</b><span>☑️ הושלמו</span></div>
</div>
<div class="bar">
  <select id="fs" aria-label="סינון לפי מקצוע"></select>
  <select id="ft" aria-label="סינון לפי התקדמות">
    <option value="">כל המצבים</option><option value="0">⬜ לא התחלתי</option><option value="1">◩ בתהליך</option><option value="2">☑️ הושלם</option>
  </select>
  <div class="chips">
    <button class="chip" id="sd">📅 מיון: הקרובים קודם</button>
    <button class="chip" id="sh">👁 הצג הושלמו</button>
  </div>
</div>
<div class="list" id="ls"></div>
<button class="fab" id="add">＋ משימה חדשה</button>

<div class="ov" id="ov"><div class="sh">
  <h2 id="ttl">משימה חדשה</h2>
  <label for="n">שם המשימה</label><input id="n" maxlength="100" placeholder="למשל: תרגילים 3-7 בעמוד 42">
  <label for="s">מקצוע</label><select id="s"></select>
  <input id="so" placeholder="שם המקצוע" style="margin-top:8px;display:none" maxlength="40">
  <label for="d">תיאור והערות</label><textarea id="d" rows="3"></textarea>
  <label for="dd">תאריך הגשה</label><input type="date" id="dd">
  <label>התקדמות</label>
  <div class="chips" id="sp"></div>
  <div class="row"><button class="btn" id="sv">💾 שמור</button><button class="btn g" id="cx">ביטול</button></div>
</div></div>

<div class="ov" id="ov2"><div class="sh">
  <h2>💾 גיבוי ושחזור</h2>
  <p style="color:var(--mu);font-size:14px;margin:0 0 8px">לגיבוי: לחצו "העתק גיבוי" והדביקו בהערות (Keep) או שלחו לעצמכם בווטסאפ. לשחזור: הדביקו את הטקסט כאן ולחצו "שחזר".</p>
  <textarea id="bt" rows="6" dir="ltr" placeholder="הדביקו כאן גיבוי"></textarea>
  <div class="row"><button class="btn" id="cp">📋 העתק גיבוי</button><button class="btn" id="rs" style="background:var(--wip)">♻️ שחזר</button></div>
  <div class="row"><button class="btn g" id="cl">סגור</button></div>
</div></div>
<div class="toast" id="to"></div>

<script>
var SUBJ=['מתמטיקה','אנגלית','תנ״ך','עברית','גאומטריה','מדעים','היסטוריה','אחר'];
var ST=[{i:'⬜',t:'לא התחלתי'},{i:'◩',t:'בתהליך'},{i:'☑️',t:'הושלם'}];
var KEY='shiurei-bait-v1';
var tasks=load(),editId=null,curSt=0,showDone=false,asc=true;
var $=function(i){return document.getElementById(i)};
function load(){try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){toast('לא הצלחתי לשמור. גבו את הנתונים')}}
function toast(m){var t=$('to');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2200)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(ds){if(!ds)return'';var a=ds.split('-'),t=today();var diff=Math.round((new Date(ds+'T00:00:00')-new Date(t+'T00:00:00'))/864e5);
  var txt=a[2]+'/'+a[1]+'/'+a[0],rel=diff===0?'היום':diff===1?'מחר':diff===-1?'אתמול':diff>1?'בעוד '+diff+' ימים':'לפני '+(-diff)+' ימים';
  return{txt:'📅 '+txt+' ('+rel+')',late:diff<0}}
function subjects(){var s=SUBJ.slice();tasks.forEach(function(t){if(s.indexOf(t.subject)<0)s.splice(s.length-1,0,t.subject)});return s}
function fillSel(){var fs=$('fs'),v=fs.value;fs.innerHTML='<option value="">כל המקצועות</option>'+subjects().map(function(s){return'<option>'+esc(s)+'</option>'}).join('');fs.value=v}
function render(){
  fillSel();
  var c=[0,0,0];tasks.forEach(function(t){c[t.status]++});
  $('c0').textContent=c[0];$('c1').textContent=c[1];$('c2').textContent=c[2];
  $('hi').textContent=(c[0]+c[1])?'יש לך '+(c[0]+c[1])+' משימות פעילות':'אין משימות פעילות 🎉';
  var fs=$('fs').value,ft=$('ft').value;
  var l=tasks.filter(function(t){
    if(fs&&t.subject!==fs)return false;
    if(ft!==''&&String(t.status)!==ft)return false;
    if(ft===''&&!showDone&&t.status===2)return false;
    return true});
  l.sort(function(a,b){var x=a.due||'9999',y=b.due||'9999';var r=x<y?-1:x>y?1:0;return asc?r:-r});
  $('ls').innerHTML=l.length?l.map(function(t){
    var f=t.due?fmt(t.due):null;
    return'<div class="task s'+t.status+'"><button class="stb" data-a="st" data-id="'+t.id+'" aria-label="שינוי התקדמות: '+ST[t.status].t+'">'+ST[t.status].i+'</button>'+
    '<div class="bd"><div class="nm">'+esc(t.name)+'</div><span class="tg">'+esc(t.subject)+'</span>'+
    (t.desc?'<div class="ds">'+esc(t.desc)+'</div>':'')+
    (f?'<div class="dt'+(f.late&&t.status<2?' late':'')+'">'+f.txt+'</div>':'')+'</div>'+
    '<div class="ac"><button data-a="ed" data-id="'+t.id+'" aria-label="עריכה">✏️</button><button data-a="rm" data-id="'+t.id+'" aria-label="מחיקה">🗑️</button></div></div>'
  }).join(''):'<div class="empty">'+(tasks.length?'אין משימות שמתאימות לסינון.':'עוד אין משימות. לחצו על "משימה חדשה" כדי להתחיל.')+'</div>';
  $('sh').classList.toggle('on',showDone);$('sh').textContent=showDone?'👁 מסתיר הושלמו':'👁 הצג הושלמו';
  $('sd').textContent=asc?'📅 מיון: הקרובים קודם':'📅 מיון: הרחוקים קודם';
}
function openForm(id){
  editId=id;var t=id?tasks.filter(function(x){return x.id===id})[0]:null;
  $('ttl').textContent=t?'עריכת משימה':'משימה חדשה';
  var sel=$('s');sel.innerHTML=subjects().map(function(s){return'<option>'+esc(s)+'</option>'}).join('');
  $('n').value=t?t.name:'';sel.value=t?t.subject:SUBJ[0];$('so').style.display='none';$('so').value='';
  $('d').value=t?t.desc:'';$('dd').value=t?t.due:'';setSt(t?t.status:0);
  $('ov').classList.add('open');setTimeout(function(){$('n').focus()},50)
}
function setSt(k){curSt=k;$('sp').innerHTML=ST.map(function(s,i){return'<button type="button" class="chip'+(i===k?' on':'')+'" data-k="'+i+'">'+s.i+' '+s.t+'</button>'}).join('')}
function saveTask(){
  var name=$('n').value.trim();if(!name){toast('צריך לכתוב שם למשימה');$('n').focus();return}
  var subj=$('s').value;
  if(subj==='אחר'&&$('so').value.trim())subj=$('so').value.trim();
  var o={name:name,subject:subj,desc:$('d').value.trim(),due:$('dd').value,status:curSt};
  if(editId){tasks.forEach(function(t){if(t.id===editId)Object.assign(t,o)})}
  else{o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);tasks.push(o)}
  save();$('ov').classList.remove('open');render();toast(editId?'המשימה עודכנה':'המשימה נוספה')
}
$('add').onclick=function(){openForm(null)};
$('cx').onclick=function(){$('ov').classList.remove('open')};
$('sv').onclick=saveTask;
$('s').onchange=function(){$('so').style.display=this.value==='אחר'?'block':'none'};
$('sp').onclick=function(e){var b=e.target.closest('[data-k]');if(b)setSt(+b.dataset.k)};
$('fs').onchange=render;$('ft').onchange=render;
$('sd').onclick=function(){asc=!asc;render()};
$('sh').onclick=function(){showDone=!showDone;render()};
$('ls').onclick=function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var id=b.dataset.id,a=b.dataset.a;
  if(a==='st'){tasks.forEach(function(t){if(t.id===id)t.status=(t.status+1)%3});save();render()}
  else if(a==='ed')openForm(id);
  else if(a==='rm'&&confirm('למחוק את המשימה?')){tasks=tasks.filter(function(t){return t.id!==id});save();render();toast('המשימה נמחקה')}
};
$('bk').onclick=function(){$('bt').value='';$('ov2').classList.add('open')};
$('cl').onclick=function(){$('ov2').classList.remove('open')};
$('cp').onclick=function(){
  var txt=JSON.stringify({app:'shiurei-bait',tasks:tasks});$('bt').value=txt;$('bt').select();
  try{navigator.clipboard.writeText(txt).then(function(){toast('הגיבוי הועתק ✔')},function(){toast('סמנו והעתיקו ידנית')})}catch(e){toast('סמנו והעתיקו ידנית')}
};
$('rs').onclick=function(){
  try{var o=JSON.parse($('bt').value.trim());var a=Array.isArray(o)?o:o.tasks;
    if(!Array.isArray(a))throw 0;
    var ok=a.filter(function(t){return t&&typeof t.name==='string'}).map(function(t){return{id:String(t.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:t.name,subject:t.subject||'אחר',desc:t.desc||'',due:t.due||'',status:[0,1,2].indexOf(t.status)>=0?t.status:0}});
    if(!confirm('לשחזר '+ok.length+' משימות? המשימות הנוכחיות יוחלפו.'))return;
    tasks=ok;save();render();$('ov2').classList.remove('open');toast('השחזור הושלם ✔')
  }catch(e){toast('הטקסט לא נראה כמו גיבוי תקין')}
};
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
